# evakuilo v2 configuration — one instance per file.

data_dir = "data"

# Network politeness (global across all sites, as in v1).
timeout_s = 30
rate_limit_ms = 2000

# Periodic job intervals, seconds.
monitor_interval_s = 1800 # RecentChanges discovery scan
shell_interval_s = 86400  # site shell + theme refresh
out_interval_s = 300      # out/ publication refresh
backfill_interval_s = 3600 # re-arm dead fetches for known-missing content

# zstd level for out/ page archives.
zstd_level = 19

[instance]
name = "kolorinko"
sites = [
      "obscurative"
    , "rpcauthority"
    , "ru-backrooms"
    , "srddf"
    , "wci"
    , "backroomsarchiveunit"
    , "cea"
    , "scientific-alliance"

    # reverify
    , "agiat"
    , "anomalydataroom"
    , "backrooms-exploration"
    , "backrooms-wiki"
    , "backroomsarchiveunit"
    , "backroomsclassified"
    , "bgpd"
    , "bpf-database"
    , "fasa"
    , "forgotten-places"
