# cargo-deny policy (pre-commit hook runs `cargo-deny check`).

[advisories]
version = 2
yanked = "warn"
ignore = [
  # Unmaintained, pulled transitively via selectors/scraper; no fix upstream.
  "RUSTSEC-2025-0057",
]

[licenses]
version = 2
allow = [
  "AGPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
