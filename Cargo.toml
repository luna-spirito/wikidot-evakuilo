[package]
name = "evakuilo"
version = "2.0.0-alpha.1"
edition = "2024"
description = "Wikidot evacuation archiver: SQLite-first scrape state, per-page zstd publication tree"
license = "MIT"

[dependencies]
anyhow = "1"
fs4 = "0.13"
hex = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
] }
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
scraper = "0.24"
tar = "0.4"
zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "time",
  "sync",
  "signal",
] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
